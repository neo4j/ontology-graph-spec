name: Validate Go Module

on:
  workflow_call:
    inputs:
      ref:
        description: 'The specific git commit SHA to checkout and test'
        required: true
        type: string

jobs:
  test-go-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go/go.mod

      - name: Run Go Module Tests
        shell: bash
        run: |
          set -euo pipefail
          # Navigate into the subfolder where the Go module resides
          cd go
          # Run tests with verbose output to verify the Kotlin/Native bridge links correctly
          go test -v ./...

      - name: Run Go Generation and Check Sync
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./go/scripts/generate-go-models.sh
          ./go/scripts/generate-go-models.sh
          
          # 2. Check for drift
          if ! git diff --exit-code; then
            echo "❌ Go models are out of sync with latest changes Kotlin. Run ./scripts/generate-go-models.sh locally and commit."
            git diff
            exit 1
          fi
