name: Unified Release Orchestrator

on:
  pull_request:
    types: [closed]
    branches: [main]

# Ensures only one release process runs at a time to prevent version collisions
concurrency:
  group: "unified-release"
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  determine-version:
    # The existing base version (x.y.z) is determined from git tags of the form `release/vX.Y.Z`.
    # How it is incremented is determined by PR labels:
    #   - `release:major|release:minor|release:patch` -> bump stable base
    #   - `release:alpha|release:rc` only -> continue dangling prerelease line, else create next patch prerelease
    #   - prerelease label + bump label -> bump base, then create/increment the prerelease on that base
    #   - `release:promote` -> promote newest dangling prerelease base to stable (no bump)
    # A prerelease line only moves forwards: alpha -> rc -> stable.
    # Invalid combinations:
    #   - more than one of `release:alpha`, `release:rc`
    #   - `release:promote` with any prerelease label
    #   - `release:promote` with any bump label

    # Only run for merged PRs that explicitly request a release label.
    if: >
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch') || 
        contains(github.event.pull_request.labels.*.name, 'release:alpha') ||
        contains(github.event.pull_request.labels.*.name, 'release:rc') ||
        contains(github.event.pull_request.labels.*.name, 'release:promote')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine bump type from Pull Request labels
        id: bump
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);

            const hasMajor = labels.includes("release:major");
            const hasMinor = labels.includes("release:minor");
            const hasPatch = labels.includes("release:patch");
            const preLabels = ["alpha", "rc"].filter(c => labels.includes(`release:${c}`));
            const hasPromote = labels.includes("release:promote");

            const bumpCount = [hasMajor, hasMinor, hasPatch].filter(Boolean).length;
            if (bumpCount > 1) {
              core.setFailed("Invalid labels: only one of release:major, release:minor, release:patch can be set.");
              return;
            }

            if (preLabels.length > 1) {
              core.setFailed("Invalid labels: only one of release:alpha, release:rc can be set.");
              return;
            }

            if (hasPromote && (preLabels.length > 0 || bumpCount > 0)) {
              core.setFailed("Invalid labels: release:promote cannot be combined with release:alpha/rc or release:major/minor/patch.");
              return;
            }

            let bump = "patch";
            if (hasMajor) bump = "major";
            else if (hasMinor) bump = "minor";

            const channel = preLabels.length === 1 ? preLabels[0] : "stable";
            const hasExplicitBump = bumpCount === 1 ? "true" : "false";
            const promote = hasPromote ? "true" : "false";

            core.setOutput("bump", bump);
            core.setOutput("channel", channel);
            core.setOutput("has_explicit_bump", hasExplicitBump);
            core.setOutput("promote", promote);

      - name: Compute next unified version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          bump="${{ steps.bump.outputs.bump }}"
          channel="${{ steps.bump.outputs.channel }}"
          has_explicit_bump="${{ steps.bump.outputs.has_explicit_bump }}"
          promote="${{ steps.bump.outputs.promote }}"

          all_tags="$(git tag -l 'release/v*' --sort=-v:refname)"
          stable_tags="$(printf '%s\n' "$all_tags" | grep -E '^release/v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          pre_tags="$(printf '%s\n' "$all_tags" | grep -E '^release/v[0-9]+\.[0-9]+\.[0-9]+-(alpha|rc)\.[0-9]+$' || true)"

          latest_stable_tag="$(printf '%s\n' "$stable_tags" | head -n1 || true)"
          latest_stable_version="${latest_stable_tag#release/v}"

          # A prerelease base (of any channel) is dangling until its stable tag exists.
          dangling_pre_base=""
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            tag_version="${tag#release/v}"
            base="${tag_version%%-*}"
            if ! git rev-parse -q --verify "refs/tags/release/v${base}" >/dev/null; then
              dangling_pre_base="$base"
              break
            fi
          done <<< "$pre_tags"

          bump_semver() {
            local version="$1"
            local bump_kind="$2"
            local major minor patch
            IFS='.' read -r major minor patch <<< "$version"

            case "${bump_kind}" in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "${major}.$((minor + 1)).0" ;;
              patch) echo "${major}.${minor}.$((patch + 1))" ;;
              *) echo "Unsupported bump type: ${bump_kind}" >&2; exit 1 ;;
            esac
          }

          if [[ "${channel}" == "stable" ]]; then
            if [[ "${promote}" == "true" ]]; then
              if [[ -z "${dangling_pre_base}" ]]; then
                echo "release:promote requested but no dangling prerelease exists" >&2
                exit 1
              fi
              next_version="${dangling_pre_base}"
            else
              baseline="${latest_stable_version:-0.0.0}"
              next_version="$(bump_semver "${baseline}" "${bump}")"
            fi
          else
            # Prerelease channel (alpha or rc)
            if [[ "${has_explicit_bump}" == "true" ]]; then
              baseline="${dangling_pre_base:-${latest_stable_version:-0.0.0}}"
              base_version="$(bump_semver "${baseline}" "${bump}")"
            else
              if [[ -n "${dangling_pre_base}" ]]; then
                base_version="${dangling_pre_base}"
              else
                baseline="${latest_stable_version:-0.0.0}"
                base_version="$(bump_semver "${baseline}" "patch")"
              fi
            fi

            # Prereleases only move forwards: refuse e.g. an alpha once an rc exists on the base.
            channels=(alpha rc)
            for i in "${!channels[@]}"; do
              [[ "${channels[$i]}" == "${channel}" ]] && channel_index="$i"
            done
            for later in "${channels[@]:$((channel_index + 1))}"; do
              if printf '%s\n' "$pre_tags" | grep -qE "^release/v${base_version//./\\.}-${later}\.[0-9]+$"; then
                echo "Cannot release a ${channel} of ${base_version}: a ${later} already exists" >&2
                exit 1
              fi
            done

            latest_base_channel_tag="$(
              printf '%s\n' "$pre_tags" \
              | grep -E "^release/v${base_version//./\\.}-${channel}\.[0-9]+$" \
              | head -n1 || true
            )"

            if [[ -n "${latest_base_channel_tag}" ]]; then
              pre_number="${latest_base_channel_tag##*-${channel}.}"
              next_version="${base_version}-${channel}.$((pre_number + 1))"
            else
              next_version="${base_version}-${channel}.1"
            fi
          fi

          echo "version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "Next version determined: ${next_version}"

  validate-go:
    needs: determine-version
    uses: ./.github/workflows/validate-go.yaml
    with:
      ref: ${{ needs.determine-version.outputs.sha }}
      # The merged commit is already on main, so the pull request diff would find nothing to check
      check-all: true

  validate-kotlin:
    needs: determine-version
    uses: ./.github/workflows/validate-kotlin.yaml
    with:
      ref: ${{ needs.determine-version.outputs.sha }}
      # The merged commit is already on main, so the pull request diff would find nothing to check
      check-all: true

  publish-npm:
    needs: [determine-version, validate-kotlin, validate-go]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.determine-version.outputs.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build JS/TS Artifacts
        run: ./gradlew assemble -Pversion=${{ needs.determine-version.outputs.version }} --no-daemon

      - name: Publish NPM Package
        run: |
          TARGET_DIR="build/dist/js/productionLibrary/"
          
          if [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            # Update package.json version dynamically before publishing
            npm version ${{ needs.determine-version.outputs.version }} --no-git-tag-version --allow-same-version
            # Prereleases (x.y.z-<channel>.N) go to the matching dist-tag, stable releases to latest
            VERSION="${{ needs.determine-version.outputs.version }}"
            if [[ "${VERSION}" =~ -([a-z]+)\.[0-9]+$ ]]; then
              NPM_TAG="${BASH_REMATCH[1]}"
            else
              NPM_TAG=latest
            fi
            npm publish --tag "${NPM_TAG}" --access public
          else
            echo "Directory $TARGET_DIR not found. Check your Gradle JS/TS build configurations."
            exit 1
          fi

  publish-maven:
    needs: [determine-version, validate-kotlin, validate-go]
    runs-on: macos-latest  # mac-os host is needed to build and compile macosArm64 targets
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.determine-version.outputs.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral -Pversion=${{ needs.determine-version.outputs.version }} --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  publish-tags:
    needs: [determine-version, validate-go, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository at specific SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          fetch-depth: 0

      - name: Create and Push Unified Tags
        shell: bash
        run: |
          set -euo pipefail
          
          # Configure Git Identity for the runner
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ needs.determine-version.outputs.version }}"
          
          echo "Creating and pushing tags for version v${VERSION}"
          
          # Create an annotated tag for the main release/spec
          git tag -a "release/v${VERSION}" -m "release v${VERSION}"
          
          # Create an annotated tag for the Go module subfolder
          git tag -a "go/v${VERSION}" -m "go v${VERSION}"
          
          # Push all newly created tags to the remote repository
          git push origin --tags
