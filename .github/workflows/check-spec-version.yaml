name: Spec Version Guard

on:
  pull_request:
    branches: [main]
  push:
    tags: ['release-spec/v*']

permissions:
  contents: read

jobs:
  check-spec-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check spec version
        env:
          SPEC_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: .github/scripts/check-spec-version.sh
