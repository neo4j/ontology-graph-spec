name: Spec Version Guard

on:
  workflow_call:
    inputs:
      ref:
        description: 'The specific git commit SHA to checkout and check'
        required: false
        type: string
    outputs:
      version:
        description: 'The validated spec version, from the schema $id'
        value: ${{ jobs.check-spec-version.outputs.version }}

permissions:
  contents: read

jobs:
  check-spec-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Check spec version
        id: check
        run: .github/scripts/check-spec-version.sh
