name: Spec Version Guard

on:
  push:
    tags: ['release-spec/v*']
  workflow_call:
    inputs:
      ref:
        description: 'The specific git commit SHA to checkout and check'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check-spec-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Check spec version
        env:
          SPEC_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: .github/scripts/check-spec-version.sh
