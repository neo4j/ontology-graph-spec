name: Validate Kotlin Multiplatform

on:
  workflow_call:
    inputs:
      ref:
        description: 'The specific git commit SHA to checkout and test'
        required: true
        type: string

env:
  WATCHED_PATHS: "src/ build.gradle.kts settings.gradle.kts gradle.properties gradle/"

jobs:
  spec-version:
    uses: ./.github/workflows/check-spec-version.yaml
    with:
      ref: ${{ inputs.ref }}

  test-kotlin:
    needs: spec-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Detect changed Kotlin or Gradle files
        id: kotlin
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD -- $WATCHED_PATHS | wc -l | tr -d ' ')
          echo "changed=$([ "$CHANGED" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Runs checks and tests for all targets (JVM, JS/TS, Native metadata)
      - name: Run Gradle Checks
        if: steps.kotlin.outputs.changed == 'true'
        run: ./gradlew check --no-daemon
