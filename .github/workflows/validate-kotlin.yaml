name: Validate Kotlin Multiplatform

on:
  workflow_call:
    inputs:
      ref:
        description: 'The specific git commit SHA to checkout and test'
        required: true
        type: string

env:
  WATCHED_PATHS: "src/ ontology-graph-spec.schema.json build.gradle.kts settings.gradle.kts gradle.properties gradle/"

jobs:
  test-kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Detect changed Kotlin or Gradle files
        id: kotlin
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then # not a pull request, always check
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_REF"
          CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD -- $WATCHED_PATHS | wc -l | tr -d ' ')
          echo "changed=$([ "$CHANGED" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Runs checks and tests for all targets (JVM, JS/TS, Native metadata)
      - name: Run Gradle Checks
        if: steps.kotlin.outputs.changed == 'true'
        run: ./gradlew check --no-daemon
