schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "complete"
description: "Every node has an identifier label and every relationship a type and ends."
nodes:
  person:
    labels:
      identifier: "Person"
  movie:
    labels:
      identifier: "Movie"
      implied: ["Work"]
relationships:
  acted-in:
    type: "ACTED_IN"
    from:
      node: "person"
    to:
      node: "movie"
