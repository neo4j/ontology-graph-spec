schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "combined"
description: "Issues from every set at once."
nodes:
  person:
    labels:
      identifier: "Person"
    properties:
      name: {}
      age:
        type: "INTEGER"
    constraints:
      unnamed:
        type: "EXISTS"
        properties: ["age"]
    aliases: ["P", "P"]
  nothing: {}
relationships:
  r:
    type: ""
    from:
      node: "person"
    to: {}
