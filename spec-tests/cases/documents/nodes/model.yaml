schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "nodes"
name: "Nodes"
description: "Covers nodes and their labels: node ids that differ from the identifying label, implied and optional labels, label custom data, descriptions, aliases, references, display positions and colours, and node custom data. Includes a node with no properties and a node with no identifying label."
nodes:
  person:
    labels:
      identifier: "Person"
      implied:
        - "Agent"
        - "LegalEntity"
      optional:
        - "Employee"
        - "Contractor"
      extensions:
        custom:
          source: "hr-system"
    properties:
      name: { type: "STRING" }
    extensions:
      display:
        x: -120.5
        y: 40
        colour: "#FF8800"
        custom:
          pinned: true
      custom:
        owner: "people-team"
    description: "A human being, whether or not they work for an organisation."
    aliases:
      - "Human"
      - "Individual"
    reference: "https://schema.org/Person"
  org:
    labels:
      identifier: "Organisation"
      implied:
        - "Agent"
        - "LegalEntity"
    extensions:
      display:
        x: 0
        y: 0
  tag:
    labels:
      identifier: "Tag"
  archived:
    labels:
      optional:
        - "Archived"
    description: "Any node that has been archived, whatever else it is."
