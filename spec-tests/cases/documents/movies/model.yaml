schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "movies"
name: "Movies"
description: "People and the films they appear in."
nodes:
  Actor:
    labels:
      identifier: "Actor"
    properties:
      id: { type: "STRING" }
      name: { type: "STRING", description: "Full name." }
    constraints:
      key_Actor_id:
        type: "KEY"
        properties: ["id"]
        name: "id_Actor_key"
      exists_Actor_name:
        type: "EXISTS"
        properties: ["name"]
        name: "name_Actor_exists"
    extensions:
      custom:
        owner: "catalogue-team"
    description: "A person who performs in films."
    aliases:
      - "Performer"
    reference: "https://schema.org/Person"
  Movie:
    labels:
      identifier: "Movie"
    properties:
      id: { type: "STRING" }
      genre: { type: "STRING", one_of: ["DRAMA", "COMEDY", "THRILLER"] }
    constraints:
      key_Movie_id:
        type: "KEY"
        properties: ["id"]
        name: "id_Movie_key"
    reference: "https://schema.org/Movie"
relationships:
  ACTED_IN:
    type: "ACTED_IN"
    from: { node: "Actor", label: "Actor", min_count: 0 }
    to: { node: "Movie", label: "Movie", min_count: 1 }
    properties:
      roles: { type: "STRING" }
    description: "An actor appeared in a film."
    reference: "https://schema.org/actor"
