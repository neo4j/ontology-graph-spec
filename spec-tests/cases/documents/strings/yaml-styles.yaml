# The same model as model.json, written with other YAML styles: comments, fields in a different order, plain,
# single-quoted and double-quoted scalars, block scalars and flow collections. Map entries such as node ids keep
# their order, as encoding preserves it.
id: strings
version: 2026.11-rc.1 # a plain scalar that isn't a number
schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json" # quoted, as the YAML reader fails on a plain URL
name: Strings
description: >-
  Covers how strings are encoded and decoded in JSON and YAML: values that look like other scalars, special
  characters, escape sequences, empty, leading and trailing whitespace, non-ASCII text and multi-line text, plus ids
  that need quoting as keys. The alternatives write the same model with other YAML styles and with JSON escapes.
nodes:
  with space:
    properties:
      scalarLookalikes:
        type: STRING
        one_of: ['true', 'false', 'null', '~', 'yes', 'no', 'on', 'off', '1', '1.0', '-5', '1e3', '0x1F', '.inf', 'NaN']
      specialCharacters:
        type: STRING
        one_of:
          - 'key: value'
          - '# not a comment'
          - '- not a list item'
          - '[brackets]'
          - '{braces}'
          - 'a, b'
          - '> folded'
          - '| literal'
          - '@at'
          - '`backtick'
          - '%percent'
          - '*star'
          - '&anchor'
          - '!tag'
          - '?question'
      escapeSequences:
        type: STRING
        one_of:
          - 'back\slash'           # single quotes take a backslash literally
          - "tab\tseparated"
          - "line one\nline two"
          - '''single'''           # a quote doubled inside single quotes
          - '"double"'
      whitespace: { type: STRING, one_of: ['', ' leading space', 'trailing space '] }
      unicode:
        type: STRING
        one_of:
          - accented é ñ ü
          - CJK 日本語
          - emoji 🎬
      multiline:
        description: |-
          First line.
          Second line: with a colon.

            Indented after a blank line.
        type: STRING
      dotted.id: { type: STRING }
      'colon:id': { type: STRING }
      'hash#id': { type: STRING }
      '-dash': { type: STRING }
    labels:
      identifier: With Space
  '123': { labels: { identifier: Numeric } }
  'true': { labels: { identifier: Boolean } }
  'null': { labels: { identifier: Null } }
  '1.5': { labels: { identifier: Decimal } }
  yes: { labels: { identifier: Yes } }
