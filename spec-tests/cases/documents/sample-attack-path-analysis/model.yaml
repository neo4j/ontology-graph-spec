schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "attack-path-analysis"
name: "Attack Path Analysis"
description: "Relates internet-facing endpoints, compute instances, vulnerabilities, workload identities, IAM policies, cloud services and business applications so that multi-hop routes from an external foothold to a high-value asset can be traversed as paths rather than inferred from separate inventories. Answers which exposed hosts carry an exploitable vulnerability, where an attacker could move laterally from there, which crown-jewel applications and sensitive cloud data those routes terminate at, which intermediate hosts most routes depend on, and how much a single compromised identity would reach."
nodes:
  Endpoint:
    labels:
      identifier: "Endpoint"
    properties:
      endpointId: { type: "STRING", description: "Unique identifier for the internet-facing entry point. Expected to be stable across scans of the external attack surface. e.g. `EP-001`." }
      dnsName: { type: "STRING", description: "Public DNS name an external attacker resolves to reach this entry point. Not unique across endpoints: the same name exposed on two ports is two endpoints. e.g. `shop.northwind.example`." }
      port: { type: "INTEGER", description: "TCP port on which this entry point accepts connections from the public internet. One port per endpoint, not a range and not a list. e.g. `443`." }
      protocol: { type: "STRING", description: "Application-layer protocol served on that port, as a lowercase identifier. Expected to be one of `https`, `http`, `ssh`, `smtp`, `postgres`, `mysql`. e.g. `https`." }
    constraints:
      key_Endpoint_endpointId:
        type: "KEY"
        properties: ["endpointId"]
        name: "endpointId_Endpoint_key"
      exists_Endpoint_dnsName:
        type: "EXISTS"
        properties: ["dnsName"]
        name: "dnsName_Endpoint_exists"
      exists_Endpoint_port:
        type: "EXISTS"
        properties: ["port"]
        name: "port_Endpoint_exists"
    extensions:
      display:
        x: -330
        y: 0
    description: "A network entry point reachable from the public internet: one listening service, identified by the public DNS name and port an unauthenticated attacker would connect to. An endpoint is the outermost step of an attack path and carries no vulnerability of its own; the exposure it creates belongs to the compute instances it resolves to."
  ComputeInstance:
    labels:
      identifier: "ComputeInstance"
    properties:
      instanceId: { type: "STRING", description: "Unique identifier for the compute instance. Expected to be the cloud or CMDB instance identifier, stable for the life of the host. e.g. `CI-001`." }
      hostname: { type: "STRING", description: "Operational hostname of the instance, for human recognition in results. Not an identifier: expected to be unique in practice but not relied on as one. e.g. `edge-proxy-01`." }
      environment: { type: "STRING", description: "Deployment environment the instance belongs to, as a lowercase identifier. Expected to be one of `production`, `staging`, `development`. Governs how seriously an exposure on the host should be read: an exploitable host in a non-production environment is only material if a path leads from it into production. e.g. `production`." }
      networkSegment: { type: "STRING", description: "Label of the network zone or subnet the instance sits in, at the granularity segmentation rules are written at. A free-form label rather than a closed set, since segment naming is site-specific. Two instances sharing a segment are not implied to reach each other — reachability is stated only by CAN_REACH. e.g. `dmz`." }
    constraints:
      key_ComputeInstance_instanceId:
        type: "KEY"
        properties: ["instanceId"]
        name: "instanceId_ComputeInstance_key"
      exists_ComputeInstance_hostname:
        type: "EXISTS"
        properties: ["hostname"]
        name: "hostname_ComputeInstance_exists"
      exists_ComputeInstance_environment:
        type: "EXISTS"
        properties: ["environment"]
        name: "environment_ComputeInstance_exists"
    extensions:
      display:
        x: -200
        y: 0
    description: "A host an attacker can execute code on: a virtual machine, bare-metal server or container host. The unit of lateral movement in this reference ontology — every hop of an internal attack path is one compute instance to the next. Vulnerabilities are carried here, not on the applications the host runs."
    aliases:
      - "Host"
      - "Server"
  CVE:
    labels:
      identifier: "CVE"
    properties:
      cveId: { type: "STRING", description: "CVE identifier as published by the CVE Program, in `CVE-YYYY-NNNN` form. e.g. `CVE-2023-4966`." }
      cvssScore: { type: "FLOAT", description: "CVSS v3.1 base score, 0.0 to 10.0. Severity of the vulnerability in isolation, with no account taken of this estate's exposure, compensating controls or asset value — the context the graph supplies separately. Not a temporal or environmental score. e.g. `9.4`." }
      severity: { type: "STRING", description: "Qualitative severity band derived from the CVSS v3.1 base score, upper case. Expected to be one of `NONE`, `LOW`, `MEDIUM`, `HIGH`, `CRITICAL` — the CVSS v3.1 qualitative rating scale. Redundant with cvssScore and carried for readability in results. e.g. `CRITICAL`.", one_of: ["NONE", "LOW", "MEDIUM", "HIGH", "CRITICAL"] }
      epssScore: { type: "FLOAT", description: "EPSS probability, 0.0 to 1.0, that the vulnerability will be exploited in the wild within the next 30 days. A likelihood, not a severity: a high EPSS on a low CVSS flaw means a weak vulnerability that is actually being used. Expected to be refreshed daily from the EPSS feed in a live deployment. e.g. `0.97`." }
      knownExploited: { type: "BOOLEAN", description: "True when the vulnerability appears in the CISA Known Exploited Vulnerabilities catalogue, meaning exploitation has been observed in the wild rather than merely predicted. The strongest single signal for prioritising a foothold. e.g. `true`.", reference: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog" }
      publishedDate: { type: "ZONED DATETIME", description: "Date the vulnerability record was first published. First publication, not last modification, and not the date the flaw was introduced or discovered. Carried as an ISO 8601 zoned datetime because local CSV imports do not support a bare date; the time is always midnight UTC and carries no meaning beyond the calendar date. e.g. `2023-10-10T00:00:00Z`." }
    constraints:
      key_CVE_cveId:
        type: "KEY"
        properties: ["cveId"]
        name: "cveId_CVE_key"
      exists_CVE_cvssScore:
        type: "EXISTS"
        properties: ["cvssScore"]
        name: "cvssScore_CVE_exists"
      exists_CVE_knownExploited:
        type: "EXISTS"
        properties: ["knownExploited"]
        name: "knownExploited_CVE_exists"
    extensions:
      display:
        x: -200
        y: -130
    description: "A published software vulnerability record, identified by its CVE identifier, together with the severity and exploitation signals used to judge it. Describes the flaw in isolation; whether the flaw matters in this estate is what the surrounding paths establish."
    aliases:
      - "Vulnerability"
  Application:
    labels:
      identifier: "Application"
    properties:
      applicationId: { type: "STRING", description: "Unique identifier for the application in the application portfolio or CMDB. e.g. `APP-001`." }
      name: { type: "STRING", description: "Business name of the application, for recognition in results. e.g. `Payment Ledger`." }
      tier: { type: "STRING", description: "Business criticality tier. Expected to be one of `P0`, `P1`, `P2`, `P3`, where the number ascends as criticality descends: `P0` is the most critical — the crown jewels whose compromise is materially damaging — and `P3` the least. Assigned by the business, not derived from the graph. e.g. `P0`." }
      businessUnit: { type: "STRING", description: "Business unit accountable for the application, used to route a finding to an owner. A free-form label rather than a closed set. e.g. `Finance`." }
    constraints:
      key_Application_applicationId:
        type: "KEY"
        properties: ["applicationId"]
        name: "applicationId_Application_key"
      exists_Application_name:
        type: "EXISTS"
        properties: ["name"]
        name: "name_Application_exists"
      exists_Application_tier:
        type: "EXISTS"
        properties: ["tier"]
        name: "tier_Application_exists"
    extensions:
      display:
        x: 60
        y: 130
    description: "A deployed business application, owned by a business unit and ranked by criticality. The business end of an attack path: what makes a route worth caring about is the tier of the application it terminates at, not the number of hops it took."
  Identity:
    labels:
      identifier: "Identity"
    properties:
      identityId: { type: "STRING", description: "Unique identifier for the IAM principal, expected to be the identity provider's own principal or role identifier. e.g. `ID-001`." }
      name: { type: "STRING", description: "Principal name of the identity as it appears in the identity provider. e.g. `svc-edge-proxy`." }
      identityType: { type: "STRING", description: "Kind of principal, as a lowercase identifier. Expected to be one of `service` (a workload credential bound to a host), `role` (an assumable set of permissions) or `human` (an interactive user account). e.g. `service`." }
    constraints:
      key_Identity_identityId:
        type: "KEY"
        properties: ["identityId"]
        name: "identityId_Identity_key"
      exists_Identity_name:
        type: "EXISTS"
        properties: ["name"]
        name: "name_Identity_exists"
    extensions:
      display:
        x: -70
        y: 0
    description: "An IAM principal whose permissions an attacker inherits on compromising something: the workload identity a compute instance's processes run as, or a role that can be assumed. The pivot from network compromise to data access — permissions reached through an identity need no further lateral movement."
  IAMPolicy:
    labels:
      identifier: "IAMPolicy"
    properties:
      policyId: { type: "STRING", description: "Unique identifier for the permission grant in the identity provider. e.g. `POL-001`." }
      name: { type: "STRING", description: "Policy name as it appears in the identity provider. e.g. `edge-logs-write`." }
      permissionLevel: { type: "STRING", description: "Coarse level of access the policy grants, as a lowercase identifier. Expected to be one of `read`, `write`, `admin`. States the highest action the policy permits on any resource it grants access to, not the typical or intended one — a policy allowing one administrative action is `admin`. e.g. `write`." }
    constraints:
      key_IAMPolicy_policyId:
        type: "KEY"
        properties: ["policyId"]
        name: "policyId_IAMPolicy_key"
      exists_IAMPolicy_name:
        type: "EXISTS"
        properties: ["name"]
        name: "name_IAMPolicy_exists"
    extensions:
      display:
        x: 60
        y: 0
    description: "A named permission grant that an identity holds, standing between the identity and the resources it can act on. Modelled as its own node rather than collapsed into the identity because one policy is typically attached to many identities, which makes an over-permissive policy a single point that many attack paths pass through."
  CloudService:
    labels:
      identifier: "CloudService"
    properties:
      serviceId: { type: "STRING", description: "Unique identifier for the cloud resource, expected to be its provider resource identifier. e.g. `CS-004`." }
      name: { type: "STRING", description: "Resource name of the cloud service as it appears in the provider console. e.g. `payment-card-vault`." }
      serviceType: { type: "STRING", description: "Kind of cloud resource, as a lowercase hyphenated identifier. Expected to be one of `object-store`, `relational-database`, `secret-store`, `message-queue`. e.g. `secret-store`." }
      dataClassification: { type: "STRING", description: "Sensitivity of the data the resource holds, as a lowercase identifier. Expected to be one of `public`, `internal`, `confidential`, `restricted`, in ascending order of sensitivity, so `restricted` is the most sensitive. Assigned by data governance, not derived from the graph. e.g. `restricted`." }
    constraints:
      key_CloudService_serviceId:
        type: "KEY"
        properties: ["serviceId"]
        name: "serviceId_CloudService_key"
      exists_CloudService_name:
        type: "EXISTS"
        properties: ["name"]
        name: "name_CloudService_exists"
      exists_CloudService_dataClassification:
        type: "EXISTS"
        properties: ["dataClassification"]
        name: "dataClassification_CloudService_exists"
    extensions:
      display:
        x: 190
        y: 0
    description: "A managed cloud resource holding or moving data — an object store, database, secret store or message queue — reachable through IAM permissions rather than through the network path. The exfiltration end of an attack path, and the reason an identity's blast radius matters independently of what the network topology allows."
relationships:
  resolvesTo:
    type: "RESOLVES_TO"
    from: { node: "Endpoint", min_count: 1 }
    to: { node: "ComputeInstance" }
    description: "Resolves an internet-facing entry point to the compute instance that serves it, making that instance directly reachable from outside the estate. Each endpoint resolves to at least one instance, and to several where traffic is load balanced; an instance may serve many endpoints, or none at all if it is purely internal."
  hasVulnerability:
    type: "HAS_VULNERABILITY"
    from: { node: "ComputeInstance" }
    to: { node: "CVE" }
    properties:
      detectedOn: { type: "ZONED DATETIME", description: "Date on which a scan last confirmed the vulnerability still present on this instance. Last confirmation rather than first detection, so a recent date means the finding is current and an old one means the instance has not been rescanned. Distinct from the CVE's own publication date. Carried as an ISO 8601 zoned datetime because local CSV imports do not support a bare date; the time is always midnight UTC and carries no meaning beyond the calendar date. e.g. `2026-08-14T00:00:00Z`." }
    constraints:
      exists_hasVulnerability_detectedOn:
        type: "EXISTS"
        properties: ["detectedOn"]
        name: "detectedOn_HAS__VULNERABILITY_exists"
    description: "Records that a vulnerability scan confirmed the named CVE present on this compute instance. Presence only — it asserts nothing about whether the flaw is reachable or exploitable in context, which is what the surrounding path establishes. An instance may carry many CVE records, or none; one CVE may affect many instances."
  canReach:
    type: "CAN_REACH"
    from: { node: "ComputeInstance" }
    to: { node: "ComputeInstance" }
    properties:
      port: { type: "INTEGER", description: "TCP port on the target instance that the source is permitted to connect to. One port per relationship, not a range: a rule opening several ports between the same pair is several rows. e.g. `443`." }
      protocol: { type: "STRING", description: "Application-layer protocol permitted on that port, as a lowercase identifier drawn from the same set as an endpoint's protocol. Expected to be one of `https`, `http`, `ssh`, `smtp`, `postgres`, `mysql`. e.g. `https`." }
    constraints:
      exists_canReach_port:
        type: "EXISTS"
        properties: ["port"]
        name: "port_CAN__REACH_exists"
    description: "States that the source compute instance is permitted to open a network connection to the target instance on the stated port, as allowed by firewall rules, security groups and routing. Directed and asymmetric: a DMZ host reaching an application server does not imply the reverse, and mutual reachability is two separate rows. It is a claim about network permission only — not that an attacker holds credentials, nor that a working exploit exists on the target. An instance may reach many instances, or none; an instance may be reachable from many, or none."
  runs:
    type: "RUNS"
    from: { node: "ComputeInstance" }
    to: { node: "Application" }
    description: "Places a business application on the compute instance that hosts it, so that compromise of the host is compromise of the application. An instance may run many applications, or none if it is infrastructure; an application may run on many instances where it is horizontally scaled, or on none if it is not yet deployed."
  runsAs:
    type: "RUNS_AS"
    from: { node: "ComputeInstance", max_count: 1 }
    to: { node: "Identity" }
    description: "Names the workload identity the instance's processes execute as, and therefore the permissions an attacker inherits the moment they run code on the host. Each instance runs as at most one workload identity; an identity may be shared by many instances, or be held by none if it is only ever assumed interactively."
  assumes:
    type: "ASSUMES"
    from: { node: "Identity" }
    to: { node: "IAMPolicy" }
    description: "Attaches a permission grant to the identity that holds it, so that everything the policy allows is available to whoever controls the identity. An identity may hold many policies, or none; a policy may be attached to many identities, which is what makes a single over-permissive policy a shared choke point."
  policyAccessesService:
    type: "HAS_ACCESS_TO"
    from: { node: "IAMPolicy" }
    to: { node: "CloudService" }
    description: "Grants the policy access to a cloud resource, at the level the policy's permissionLevel states. This is the data-exfiltration hop: it needs no network path, so any identity holding the policy reaches the resource regardless of where it sits in the network. One policy may grant access to many resources, or to none if it only grants application access; one resource may be granted by many policies."
  policyAccessesApplication:
    type: "HAS_ACCESS_TO"
    from: { node: "IAMPolicy" }
    to: { node: "Application" }
    description: "Grants the policy administrative or operational access to a business application through its control plane, at the level the policy's permissionLevel states. Distinct from the grant to a cloud resource: this reaches an application without compromising the host that runs it, so a crown-jewel application can be exposed by a policy alone with no lateral movement involved. One policy may grant access to many applications, or to none; one application may be granted by many policies, or by none."
extensions:
  data_source_tables:
    endpoints.csv:
      source: "local"
      columns:
        - name: "endpointId"
          type: "string"
        - name: "dnsName"
          type: "string"
        - name: "port"
          type: "string"
        - name: "protocol"
          type: "string"
    compute_instances.csv:
      source: "local"
      columns:
        - name: "instanceId"
          type: "string"
        - name: "hostname"
          type: "string"
        - name: "environment"
          type: "string"
        - name: "networkSegment"
          type: "string"
    cves.csv:
      source: "local"
      columns:
        - name: "cveId"
          type: "string"
        - name: "cvssScore"
          type: "string"
        - name: "severity"
          type: "string"
        - name: "epssScore"
          type: "string"
        - name: "knownExploited"
          type: "string"
        - name: "publishedDate"
          type: "string"
    applications.csv:
      source: "local"
      columns:
        - name: "applicationId"
          type: "string"
        - name: "name"
          type: "string"
        - name: "tier"
          type: "string"
        - name: "businessUnit"
          type: "string"
    identities.csv:
      source: "local"
      columns:
        - name: "identityId"
          type: "string"
        - name: "name"
          type: "string"
        - name: "identityType"
          type: "string"
    iam_policies.csv:
      source: "local"
      columns:
        - name: "policyId"
          type: "string"
        - name: "name"
          type: "string"
        - name: "permissionLevel"
          type: "string"
    cloud_services.csv:
      source: "local"
      columns:
        - name: "serviceId"
          type: "string"
        - name: "name"
          type: "string"
        - name: "serviceType"
          type: "string"
        - name: "dataClassification"
          type: "string"
    endpoint_resolves_to.csv:
      source: "local"
      columns:
        - name: "endpointId"
          type: "string"
        - name: "instanceId"
          type: "string"
    instance_has_vulnerability.csv:
      source: "local"
      columns:
        - name: "instanceId"
          type: "string"
        - name: "cveId"
          type: "string"
        - name: "detectedOn"
          type: "string"
    instance_can_reach.csv:
      source: "local"
      columns:
        - name: "fromInstanceId"
          type: "string"
        - name: "toInstanceId"
          type: "string"
        - name: "port"
          type: "string"
        - name: "protocol"
          type: "string"
    instance_runs.csv:
      source: "local"
      columns:
        - name: "instanceId"
          type: "string"
        - name: "applicationId"
          type: "string"
    instance_runs_as.csv:
      source: "local"
      columns:
        - name: "instanceId"
          type: "string"
        - name: "identityId"
          type: "string"
    identity_assumes.csv:
      source: "local"
      columns:
        - name: "identityId"
          type: "string"
        - name: "policyId"
          type: "string"
    policy_accesses_service.csv:
      source: "local"
      columns:
        - name: "policyId"
          type: "string"
        - name: "serviceId"
          type: "string"
    policy_accesses_application.csv:
      source: "local"
      columns:
        - name: "policyId"
          type: "string"
        - name: "applicationId"
          type: "string"
  data_source_mappings:
    mapping0:
      - type: "NODE"
        node: "Endpoint"
        table: "endpoints.csv"
        properties:
          endpointId: { column: "endpointId" }
          dnsName: { column: "dnsName" }
          port: { column: "port" }
          protocol: { column: "protocol" }
        key: ["endpointId"]
      - type: "NODE"
        node: "ComputeInstance"
        table: "compute_instances.csv"
        properties:
          instanceId: { column: "instanceId" }
          hostname: { column: "hostname" }
          environment: { column: "environment" }
          networkSegment: { column: "networkSegment" }
        key: ["instanceId"]
      - type: "NODE"
        node: "CVE"
        table: "cves.csv"
        properties:
          cveId: { column: "cveId" }
          cvssScore: { column: "cvssScore" }
          severity: { column: "severity" }
          epssScore: { column: "epssScore" }
          knownExploited: { column: "knownExploited" }
          publishedDate: { column: "publishedDate" }
        key: ["cveId"]
      - type: "NODE"
        node: "Application"
        table: "applications.csv"
        properties:
          applicationId: { column: "applicationId" }
          name: { column: "name" }
          tier: { column: "tier" }
          businessUnit: { column: "businessUnit" }
        key: ["applicationId"]
      - type: "NODE"
        node: "Identity"
        table: "identities.csv"
        properties:
          identityId: { column: "identityId" }
          name: { column: "name" }
          identityType: { column: "identityType" }
        key: ["identityId"]
      - type: "NODE"
        node: "IAMPolicy"
        table: "iam_policies.csv"
        properties:
          policyId: { column: "policyId" }
          name: { column: "name" }
          permissionLevel: { column: "permissionLevel" }
        key: ["policyId"]
      - type: "NODE"
        node: "CloudService"
        table: "cloud_services.csv"
        properties:
          serviceId: { column: "serviceId" }
          name: { column: "name" }
          serviceType: { column: "serviceType" }
          dataClassification: { column: "dataClassification" }
        key: ["serviceId"]
      - type: "RELATIONSHIP"
        relationship: "resolvesTo"
        table: "endpoint_resolves_to.csv"
        from_node:
          label: "Endpoint"
          properties:
            endpointId: { column: "endpointId" }
        to_node:
          label: "ComputeInstance"
          properties:
            instanceId: { column: "instanceId" }
      - type: "RELATIONSHIP"
        relationship: "hasVulnerability"
        table: "instance_has_vulnerability.csv"
        from_node:
          label: "ComputeInstance"
          properties:
            instanceId: { column: "instanceId" }
        to_node:
          label: "CVE"
          properties:
            cveId: { column: "cveId" }
        properties:
          detectedOn: { column: "detectedOn" }
      - type: "RELATIONSHIP"
        relationship: "canReach"
        table: "instance_can_reach.csv"
        from_node:
          label: "ComputeInstance"
          properties:
            instanceId: { column: "fromInstanceId" }
        to_node:
          label: "ComputeInstance"
          properties:
            instanceId: { column: "toInstanceId" }
        properties:
          port: { column: "port" }
          protocol: { column: "protocol" }
      - type: "RELATIONSHIP"
        relationship: "runs"
        table: "instance_runs.csv"
        from_node:
          label: "ComputeInstance"
          properties:
            instanceId: { column: "instanceId" }
        to_node:
          label: "Application"
          properties:
            applicationId: { column: "applicationId" }
      - type: "RELATIONSHIP"
        relationship: "runsAs"
        table: "instance_runs_as.csv"
        from_node:
          label: "ComputeInstance"
          properties:
            instanceId: { column: "instanceId" }
        to_node:
          label: "Identity"
          properties:
            identityId: { column: "identityId" }
      - type: "RELATIONSHIP"
        relationship: "assumes"
        table: "identity_assumes.csv"
        from_node:
          label: "Identity"
          properties:
            identityId: { column: "identityId" }
        to_node:
          label: "IAMPolicy"
          properties:
            policyId: { column: "policyId" }
      - type: "RELATIONSHIP"
        relationship: "policyAccessesService"
        table: "policy_accesses_service.csv"
        from_node:
          label: "IAMPolicy"
          properties:
            policyId: { column: "policyId" }
        to_node:
          label: "CloudService"
          properties:
            serviceId: { column: "serviceId" }
      - type: "RELATIONSHIP"
        relationship: "policyAccessesApplication"
        table: "policy_accesses_application.csv"
        from_node:
          label: "IAMPolicy"
          properties:
            policyId: { column: "policyId" }
        to_node:
          label: "Application"
          properties:
            applicationId: { column: "applicationId" }
