schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "retail-banking"
name: "Retail Banking Transaction Fraud Ring"
description: "Models retail banking payments as accounts joined by transaction nodes, so that money moved through a chain of accounts and back to where it started is detectable as a cycle rather than as a self-join. Answers which accounts form a closed ring, whether the payments around that ring run in chronological order, and whether the amount decays consistently as it moves."
nodes:
  Account:
    labels:
      identifier: "Account"
    properties:
      accountNumber: { type: "INTEGER", description: "Identifier for the account, unique across the institution. Expected to be an internal account key rather than a printed sort-code-and-number pair, and to be stable for the life of the account. e.g. `1247`." }
    constraints:
      key_Account_accountNumber:
        type: "KEY"
        properties: ["accountNumber"]
        name: "accountNumber_Account_key"
    extensions:
      display:
        x: 33
        y: 51
    description: "A retail bank account that can send and receive payments. Carries only its identifier: the reference ontology deliberately holds no customer, product or balance detail, so an account is a point money passes through rather than a party profile."
  Transaction:
    labels:
      identifier: "Transaction"
    properties:
      transactionId: { type: "STRING", description: "Identifier for the payment, unique across the institution. Expected to be the source system's own transaction reference. e.g. `TXN3001`." }
      amount: { type: "FLOAT", description: "Value of money moved by this payment, in the major units of `currency` rather than in minor units — a value of 1000.00 on a GBP payment is one thousand pounds, not one thousand pence. Always positive: direction is carried by the relationships, not by the sign. e.g. `131.46`." }
      currency: { type: "STRING", description: "ISO 4217 alphabetic currency code of `amount`, recorded in whatever case the source system supplies rather than normalised to upper case. A single ring is only comparable on amount when every payment in it shares one currency; the reference ontology performs no conversion. e.g. `gbp`.", pattern: "^[A-Za-z]{3}$" }
      date: { type: "ZONED DATETIME", description: "Instant at which the payment was executed, as an ISO 8601 zoned datetime. Ordering payments on this is what separates a ring that moves money forwards in time from an arbitrary cycle, so it is expected to be a true execution timestamp rather than a posting or value date. e.g. `2023-11-16T11:15:00Z`." }
    constraints:
      key_Transaction_transactionId:
        type: "KEY"
        properties: ["transactionId"]
        name: "transactionId_Transaction_key"
      exists_Transaction_amount:
        type: "EXISTS"
        properties: ["amount"]
        name: "amount_Transaction_exists"
      exists_Transaction_currency:
        type: "EXISTS"
        properties: ["currency"]
        name: "currency_Transaction_exists"
      exists_Transaction_date:
        type: "EXISTS"
        properties: ["date"]
        name: "date_Transaction_exists"
    extensions:
      display:
        x: -33
        y: -51
    description: "A single payment moving money from one account to another. Modelled as a node rather than as a relationship so that it can carry its own amount and timestamp and be traversed from either endpoint — which is what makes the chronological-order and amount-decay checks in ring detection expressible at all."
relationships:
  benefitsTo:
    type: "BENEFITS_TO"
    from: { node: "Transaction", count: 1 }
    to: { node: "Account" }
    description: "Credits the payment to the account that receives the money — the beneficiary side of the transfer. Exactly one beneficiary account per payment; an account may benefit from many payments, or from none. Following this out of a payment and then back out through the beneficiary's own outgoing payments is how a ring is walked."
  performs:
    type: "PERFORMS"
    from: { node: "Account" }
    to: { node: "Transaction", count: 1 }
    description: "Attributes the payment to the account the money leaves — the originating side of the transfer. Exactly one originating account per payment; an account may perform many payments, or none. Read together with the beneficiary link it gives each payment a direction, which is what makes cycle detection meaningful rather than merely finding connected accounts."
extensions:
  data_source_tables:
    accounts.csv:
      source: "local"
      columns:
        - name: "accountNumber"
          type: "string"
    transactions.csv:
      source: "local"
      columns:
        - name: "transactionId"
          type: "string"
        - name: "amount"
          type: "string"
        - name: "currency"
          type: "string"
        - name: "date"
          type: "string"
        - name: "sourceAccountNumber"
          type: "string"
        - name: "targetAccountNumber"
          type: "string"
  data_source_mappings:
    mapping0:
      - type: "NODE"
        node: "Account"
        table: "accounts.csv"
        properties:
          accountNumber: { column: "accountNumber" }
        key: ["accountNumber"]
      - type: "NODE"
        node: "Transaction"
        table: "transactions.csv"
        properties:
          transactionId: { column: "transactionId" }
          amount: { column: "amount" }
          currency: { column: "currency" }
          date: { column: "date" }
        key: ["transactionId"]
      - type: "RELATIONSHIP"
        relationship: "benefitsTo"
        table: "transactions.csv"
        from_node:
          label: "Transaction"
          properties:
            transactionId: { column: "transactionId" }
        to_node:
          label: "Account"
          properties:
            accountNumber: { column: "targetAccountNumber" }
      - type: "RELATIONSHIP"
        relationship: "performs"
        table: "transactions.csv"
        from_node:
          label: "Account"
          properties:
            accountNumber: { column: "sourceAccountNumber" }
        to_node:
          label: "Transaction"
          properties:
            transactionId: { column: "transactionId" }
