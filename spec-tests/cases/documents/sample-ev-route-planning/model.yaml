schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "ev-route-planning"
name: "EV Route Planning"
description: "Models a logistics network as cities and charging sites joined by road segments, alongside a fleet of electric vehicles described by battery, efficiency and charging limits. Answers which vehicles can cover a given lane, what a route looks like once charging stops are part of the plan, and which places sit beyond reach of any charger."
nodes:
  Geo:
    labels:
      identifier: "Geo"
    properties:
      name: { type: "STRING", description: "Name of the place, and its identifier on the network. Expected to be unique across the whole network rather than within a region. e.g. `Paris`." }
      lat: { type: "FLOAT", description: "Latitude in decimal degrees on WGS 84, positive northwards. Used for straight-line distance filters that prune candidates before a traversal; it is not the distance a vehicle drives, which is carried on the road segment. e.g. `48.8566`." }
      lon: { type: "FLOAT", description: "Longitude in decimal degrees on WGS 84, positive eastwards. e.g. `2.3522`." }
      region: { type: "STRING", description: "Administrative region the place sits in, used to group and summarise coverage rather than to route. e.g. `Ile-de-France`." }
    constraints:
      key_Geo_name:
        type: "KEY"
        properties: ["name"]
        name: "name_Geo_key"
      exists_Geo_lat:
        type: "EXISTS"
        properties: ["lat"]
        name: "lat_Geo_exists"
      exists_Geo_lon:
        type: "EXISTS"
        properties: ["lon"]
        name: "lon_Geo_exists"
      exists_Geo_region:
        type: "EXISTS"
        properties: ["region"]
        name: "region_Geo_exists"
    extensions:
      display:
        x: -73
        y: 0
    description: "A place on the network that is not a charging site — a city, depot or delivery point. Deliberately carries no label in common with a charging site: the reference ontology gives each node a single label, so any traversal meaning 'any location' must name both labels explicitly or it will silently plan routes that never charge."
  ChargingStation:
    labels:
      identifier: "ChargingStation"
    properties:
      name: { type: "STRING", description: "Name of the charging site, and its identifier on the network. e.g. `CS-A1-01`." }
      lat: { type: "FLOAT", description: "Latitude in decimal degrees on WGS 84, positive northwards. e.g. `49.7953`." }
      lon: { type: "FLOAT", description: "Longitude in decimal degrees on WGS 84, positive eastwards. e.g. `2.7256`." }
      region: { type: "STRING", description: "Administrative region the site sits in, used to summarise charging capacity and coverage by area. e.g. `Hauts-de-France`." }
      operator: { type: "STRING", description: "Network operator running the site. Expected to matter for access and tariffs rather than for routing. e.g. `ElectraRoute`." }
      power_kw: { type: "FLOAT", description: "Maximum power the site can deliver to a single vehicle, in kilowatts. The power a given vehicle actually receives is the lesser of this and that vehicle's own charging limit, so this is a ceiling rather than a delivered rate. e.g. `350.0`." }
    constraints:
      key_ChargingStation_name:
        type: "KEY"
        properties: ["name"]
        name: "name_ChargingStation_key"
      exists_ChargingStation_lat:
        type: "EXISTS"
        properties: ["lat"]
        name: "lat_ChargingStation_exists"
      exists_ChargingStation_lon:
        type: "EXISTS"
        properties: ["lon"]
        name: "lon_ChargingStation_exists"
      exists_ChargingStation_region:
        type: "EXISTS"
        properties: ["region"]
        name: "region_ChargingStation_exists"
      exists_ChargingStation_operator:
        type: "EXISTS"
        properties: ["operator"]
        name: "operator_ChargingStation_exists"
      exists_ChargingStation_power_kw:
        type: "EXISTS"
        properties: ["power_kw"]
        name: "power__kw_ChargingStation_exists"
    extensions:
      display:
        x: 73
        y: 0
    description: "A site where vehicles can charge, sitting on the road network as a place in its own right. Shares no label with other locations, so a route that must be able to charge has to traverse both labels explicitly."
  Car:
    labels:
      identifier: "Car"
    properties:
      id: { type: "STRING", description: "Identifier for the vehicle in the fleet. e.g. `EV-001`." }
      model: { type: "STRING", description: "Manufacturer's model name for the vehicle. Descriptive only; the energy model reads the numeric properties, never this. e.g. `Corvia eVan 60`." }
      vehicle_class: { type: "STRING", description: "Category of vehicle, used to group the fleet when comparing what different classes can serve. e.g. `Light Van`." }
      battery_capacity_kwh: { type: "FLOAT", description: "Usable battery capacity in kilowatt-hours. Expected to be the usable figure rather than the nominal pack size, since range is computed directly from it. e.g. `60.0`." }
      efficiency_kwh_per_km: { type: "FLOAT", description: "Energy consumed per kilometre driven, in kilowatt-hours per kilometre — a consumption rate, so a higher number means a less efficient vehicle. Treated as constant, with no allowance for load, gradient, weather or speed. e.g. `0.24`." }
      max_charge_power_kw: { type: "FLOAT", description: "Highest charging power the vehicle can accept, in kilowatts. Caps what it draws from a site however powerful that site is; a plan that ignores this cap produces charging stops shorter than the fleet can achieve. e.g. `90.0`." }
      current_soc_percent: { type: "FLOAT", description: "Current battery state of charge as a percentage of `battery_capacity_kwh`, from 0 to 100. A snapshot of the vehicle now, and the starting state a route is evaluated from, not a static attribute. e.g. `38.0`." }
    constraints:
      key_Car_id:
        type: "KEY"
        properties: ["id"]
        name: "id_Car_key"
      exists_Car_model:
        type: "EXISTS"
        properties: ["model"]
        name: "model_Car_exists"
      exists_Car_vehicle_class:
        type: "EXISTS"
        properties: ["vehicle_class"]
        name: "vehicle__class_Car_exists"
      exists_Car_battery_capacity_kwh:
        type: "EXISTS"
        properties: ["battery_capacity_kwh"]
        name: "battery__capacity__kwh_Car_exists"
      exists_Car_efficiency_kwh_per_km:
        type: "EXISTS"
        properties: ["efficiency_kwh_per_km"]
        name: "efficiency__kwh__per__km_Car_exists"
      exists_Car_max_charge_power_kw:
        type: "EXISTS"
        properties: ["max_charge_power_kw"]
        name: "max__charge__power__kw_Car_exists"
      exists_Car_current_soc_percent:
        type: "EXISTS"
        properties: ["current_soc_percent"]
        name: "current__soc__percent_Car_exists"
    extensions:
      display:
        x: 0
        y: -87
    description: "A vehicle in the fleet, described by the battery and efficiency figures a route plan needs. Carries no connection to the network: a vehicle is not positioned on the graph, but supplies the energy model a traversal is evaluated against."
relationships:
  geoRoadGeo:
    type: "ROAD"
    from: { node: "Geo" }
    to: { node: "Geo" }
    properties:
      road_ref: { type: "STRING", description: "Designation of the road the segment belongs to, as signed. Several segments may share one designation. e.g. `A1`." }
      road_class: { type: "STRING", description: "Class of road, from the network's own four-tier vocabulary — `Motorway`, `Express`, `Trunk` and `Local` — in descending order of speed. e.g. `Motorway`." }
      distance_km: { type: "FLOAT", description: "Driving distance along the segment in kilometres. This, not the straight-line distance between coordinates, is what energy consumption is computed from. e.g. `112.7`." }
      free_flow_speed_kph: { type: "INTEGER", description: "Speed in kilometres per hour expected on the segment when traffic is light — the off-peak case. e.g. `130`." }
      peak_speed_kph: { type: "INTEGER", description: "Speed in kilometres per hour expected on the segment at peak traffic. Expected to be at or below the free-flow speed; choosing between the two is how a plan accounts for time of day. e.g. `95`." }
    constraints:
      exists_geoRoadGeo_road_ref:
        type: "EXISTS"
        properties: ["road_ref"]
        name: "road__ref_ROAD_exists"
      exists_geoRoadGeo_road_class:
        type: "EXISTS"
        properties: ["road_class"]
        name: "road__class_ROAD_exists"
      exists_geoRoadGeo_distance_km:
        type: "EXISTS"
        properties: ["distance_km"]
        name: "distance__km_ROAD_exists"
      exists_geoRoadGeo_free_flow_speed_kph:
        type: "EXISTS"
        properties: ["free_flow_speed_kph"]
        name: "free__flow__speed__kph_ROAD_exists"
      exists_geoRoadGeo_peak_speed_kph:
        type: "EXISTS"
        properties: ["peak_speed_kph"]
        name: "peak__speed__kph_ROAD_exists"
    description: "A road segment between two places on the network, neither of them a charging site. Stored once per segment and expected to be traversed undirected: the stored direction is an artefact of how the row was written, not a one-way restriction, and reverse segments are deliberately not created. A place may be joined to several others, or to none."
  geoRoadChargingStation:
    type: "ROAD"
    from: { node: "Geo" }
    to: { node: "ChargingStation" }
    properties:
      road_ref: { type: "STRING", description: "Designation of the road the segment belongs to, as signed. Expected on every ROAD relationship. e.g. `A1`." }
      road_class: { type: "STRING", description: "Class of road, from the network's own four-tier vocabulary — `Motorway`, `Express`, `Trunk` and `Local` — in descending order of speed. Expected on every ROAD relationship. e.g. `Express`." }
      distance_km: { type: "FLOAT", description: "Driving distance along the segment in kilometres, and the basis for the energy cost of detouring to charge. Expected on every ROAD relationship. e.g. `105.8`." }
      free_flow_speed_kph: { type: "INTEGER", description: "Speed in kilometres per hour expected on the segment when traffic is light. Expected on every ROAD relationship. e.g. `130`." }
      peak_speed_kph: { type: "INTEGER", description: "Speed in kilometres per hour expected on the segment at peak traffic. Expected on every ROAD relationship. e.g. `105`." }
    description: "A road segment joining a place to a charging site — the approach that makes the site reachable. Stored once per segment and expected to be traversed undirected, so this and the segment definition written from a site to a place are two halves of one convention rather than a pair of one-way roads. A place may reach several sites, or none."
  chargingStationRoadGeo:
    type: "ROAD"
    from: { node: "ChargingStation" }
    to: { node: "Geo" }
    properties:
      road_ref: { type: "STRING", description: "Designation of the road the segment belongs to, as signed. Expected on every ROAD relationship. e.g. `A1`." }
      road_class: { type: "STRING", description: "Class of road, from the network's own four-tier vocabulary — `Motorway`, `Express`, `Trunk` and `Local` — in descending order of speed. Expected on every ROAD relationship. e.g. `Express`." }
      distance_km: { type: "FLOAT", description: "Driving distance along the segment in kilometres. Expected on every ROAD relationship. e.g. `119.2`." }
      free_flow_speed_kph: { type: "INTEGER", description: "Speed in kilometres per hour expected on the segment when traffic is light. Expected on every ROAD relationship. e.g. `130`." }
      peak_speed_kph: { type: "INTEGER", description: "Speed in kilometres per hour expected on the segment at peak traffic. Expected on every ROAD relationship. e.g. `105`." }
    description: "A road segment joining a charging site back to a place — the continuation after a charging stop. Stored once per segment and expected to be traversed undirected. Not every site carries one, so its absence means only that no onward segment was recorded, never that a site is a dead end."
  charge:
    type: "CHARGE"
    from: { node: "ChargingStation", min_count: 1 }
    to: { node: "ChargingStation" }
    properties:
      tier: { type: "STRING", description: "Name of the charging option, from the site's own vocabulary — a short `top-up` stop against a longer `full` charge. Distinguishes the parallel options at one site. e.g. `top-up`." }
      time_in_minutes: { type: "INTEGER", description: "Dwell time the option represents, in minutes — how long the vehicle stands at the site. Combined with delivered power it gives the energy gained, and it is what a route's elapsed time accumulates. e.g. `15`." }
      power_kw: { type: "FLOAT", description: "Power offered by this option in kilowatts. The vehicle receives the lesser of this and its own `max_charge_power_kw`, so energy gained is that lesser figure applied over the dwell time, never this figure alone. e.g. `350.0`." }
    constraints:
      exists_charge_tier:
        type: "EXISTS"
        properties: ["tier"]
        name: "tier_CHARGE_exists"
      exists_charge_time_in_minutes:
        type: "EXISTS"
        properties: ["time_in_minutes"]
        name: "time__in__minutes_CHARGE_exists"
      exists_charge_power_kw:
        type: "EXISTS"
        properties: ["power_kw"]
        name: "power__kw_CHARGE_exists"
    description: "A charging option at a site, modelled as a self-loop so that a route can pass through a charging stop without leaving the site. One of these per tier the site offers, so a site carries several in parallel and they are distinguished by `tier` rather than by endpoint. Every site is expected to offer at least one."
extensions:
  data_source_tables:
    cities.csv:
      source: "local"
      columns:
        - name: "name"
          type: "string"
        - name: "lat"
          type: "string"
        - name: "lon"
          type: "string"
        - name: "region"
          type: "string"
    "charging-stations.csv":
      source: "local"
      columns:
        - name: "name"
          type: "string"
        - name: "lat"
          type: "string"
        - name: "lon"
          type: "string"
        - name: "region"
          type: "string"
        - name: "operator"
          type: "string"
        - name: "power_kw"
          type: "string"
    cars.csv:
      source: "local"
      columns:
        - name: "id"
          type: "string"
        - name: "model"
          type: "string"
        - name: "vehicle_class"
          type: "string"
        - name: "battery_capacity_kwh"
          type: "string"
        - name: "efficiency_kwh_per_km"
          type: "string"
        - name: "max_charge_power_kw"
          type: "string"
        - name: "current_soc_percent"
          type: "string"
    "roads-city-city.csv":
      source: "local"
      columns:
        - name: "from_name"
          type: "string"
        - name: "to_name"
          type: "string"
        - name: "road_ref"
          type: "string"
        - name: "road_class"
          type: "string"
        - name: "distance_km"
          type: "string"
        - name: "free_flow_speed_kph"
          type: "string"
        - name: "peak_speed_kph"
          type: "string"
    "roads-city-station.csv":
      source: "local"
      columns:
        - name: "from_name"
          type: "string"
        - name: "to_name"
          type: "string"
        - name: "road_ref"
          type: "string"
        - name: "road_class"
          type: "string"
        - name: "distance_km"
          type: "string"
        - name: "free_flow_speed_kph"
          type: "string"
        - name: "peak_speed_kph"
          type: "string"
    "roads-station-city.csv":
      source: "local"
      columns:
        - name: "from_name"
          type: "string"
        - name: "to_name"
          type: "string"
        - name: "road_ref"
          type: "string"
        - name: "road_class"
          type: "string"
        - name: "distance_km"
          type: "string"
        - name: "free_flow_speed_kph"
          type: "string"
        - name: "peak_speed_kph"
          type: "string"
    charges.csv:
      source: "local"
      columns:
        - name: "station_name"
          type: "string"
        - name: "tier"
          type: "string"
        - name: "time_in_minutes"
          type: "string"
        - name: "power_kw"
          type: "string"
  data_source_mappings:
    mapping0:
      - type: "NODE"
        node: "Geo"
        table: "cities.csv"
        properties:
          name: { column: "name" }
          lat: { column: "lat" }
          lon: { column: "lon" }
          region: { column: "region" }
        key: ["name"]
      - type: "NODE"
        node: "ChargingStation"
        table: "charging-stations.csv"
        properties:
          name: { column: "name" }
          lat: { column: "lat" }
          lon: { column: "lon" }
          region: { column: "region" }
          operator: { column: "operator" }
          power_kw: { column: "power_kw" }
        key: ["name"]
      - type: "NODE"
        node: "Car"
        table: "cars.csv"
        properties:
          id: { column: "id" }
          model: { column: "model" }
          vehicle_class: { column: "vehicle_class" }
          battery_capacity_kwh: { column: "battery_capacity_kwh" }
          efficiency_kwh_per_km: { column: "efficiency_kwh_per_km" }
          max_charge_power_kw: { column: "max_charge_power_kw" }
          current_soc_percent: { column: "current_soc_percent" }
        key: ["id"]
      - type: "RELATIONSHIP"
        relationship: "geoRoadGeo"
        table: "roads-city-city.csv"
        from_node:
          label: "Geo"
          properties:
            name: { column: "from_name" }
        to_node:
          label: "Geo"
          properties:
            name: { column: "to_name" }
        properties:
          road_ref: { column: "road_ref" }
          road_class: { column: "road_class" }
          distance_km: { column: "distance_km" }
          free_flow_speed_kph: { column: "free_flow_speed_kph" }
          peak_speed_kph: { column: "peak_speed_kph" }
      - type: "RELATIONSHIP"
        relationship: "geoRoadChargingStation"
        table: "roads-city-station.csv"
        from_node:
          label: "Geo"
          properties:
            name: { column: "from_name" }
        to_node:
          label: "ChargingStation"
          properties:
            name: { column: "to_name" }
        properties:
          road_ref: { column: "road_ref" }
          road_class: { column: "road_class" }
          distance_km: { column: "distance_km" }
          free_flow_speed_kph: { column: "free_flow_speed_kph" }
          peak_speed_kph: { column: "peak_speed_kph" }
      - type: "RELATIONSHIP"
        relationship: "chargingStationRoadGeo"
        table: "roads-station-city.csv"
        from_node:
          label: "ChargingStation"
          properties:
            name: { column: "from_name" }
        to_node:
          label: "Geo"
          properties:
            name: { column: "to_name" }
        properties:
          road_ref: { column: "road_ref" }
          road_class: { column: "road_class" }
          distance_km: { column: "distance_km" }
          free_flow_speed_kph: { column: "free_flow_speed_kph" }
          peak_speed_kph: { column: "peak_speed_kph" }
      - type: "RELATIONSHIP"
        relationship: "charge"
        table: "charges.csv"
        from_node:
          label: "ChargingStation"
          properties:
            name: { column: "station_name" }
        to_node:
          label: "ChargingStation"
          properties:
            name: { column: "station_name" }
        properties:
          tier: { column: "tier" }
          time_in_minutes: { column: "time_in_minutes" }
          power_kw: { column: "power_kw" }
        key: ["tier"]
