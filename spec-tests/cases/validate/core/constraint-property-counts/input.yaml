schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "constraint-property-counts"
description: "Existence constraints with several properties, type constraints with none, and a repeated single property that still counts as one."
nodes:
  person:
    properties:
      name: { type: "STRING" }
      age: { type: "INTEGER" }
    constraints:
      name_age_exists:
        type: "EXISTS"
        properties: ["name", "age"]
      nothing_type:
        type: "PROPERTY_TYPE"
        properties: []
      name_name_type:
        type: "PROPERTY_TYPE"
        properties: ["name", "name"]
      age_age_exists:
        type: "EXISTS"
        properties: ["age", "age"]
relationships:
  knows:
    type: "KNOWS"
    from: {}
    to: {}
    properties:
      since: { type: "DATE" }
      weight: { type: "FLOAT" }
    constraints:
      since_weight_exists:
        type: "EXISTS"
        properties: ["since", "weight"]
      nothing_type:
        type: "PROPERTY_TYPE"
        properties: []
      since_since_type:
        type: "PROPERTY_TYPE"
        properties: ["since", "since"]
