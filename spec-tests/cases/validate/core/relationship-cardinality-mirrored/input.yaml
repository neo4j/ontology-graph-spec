schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "relationship-cardinality-mirrored"
description: "The relationship-cardinality case with each check on the opposite end, a count alongside a min_count, and equal minimum and maximum counts that are valid."
relationships:
  knows:
    type: "KNOWS"
    from: { count: -1 }
    to: { count: 1, min_count: 1 }
  follows:
    type: "FOLLOWS"
    from: { min_count: 3, max_count: 2 }
    to: { min_count: -1 }
  likes:
    type: "LIKES"
    from: {}
    to: { max_count: -1 }
  pairs:
    type: "PAIRS"
    from: { min_count: 2, max_count: 2 }
    to: { count: 0 }
