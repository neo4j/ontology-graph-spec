schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "relationship-cardinality"
description: "Relationship ends with conflicting, negative or inverted counts."
relationships:
  knows:
    type: "KNOWS"
    from: { count: 1, max_count: 2 }
    to: { count: -1 }
  follows:
    type: "FOLLOWS"
    from: { min_count: -1 }
    to: { min_count: 3, max_count: 2 }
