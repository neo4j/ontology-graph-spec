schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "key-overlap-variants"
description: "An existence constraint and a reordered composite unique constraint overlapping node keys, a unique constraint overlapping a relationship key, and a type constraint on a key property, which isn't redundant."
nodes:
  person:
    properties:
      id: { type: "STRING" }
      code: { type: "STRING" }
      region: { type: "STRING" }
    constraints:
      id_key:
        type: "KEY"
        properties: ["id"]
      id_exists:
        type: "EXISTS"
        properties: ["id"]
      id_type:
        type: "PROPERTY_TYPE"
        properties: ["id"]
      code_region_key:
        type: "KEY"
        properties: ["code", "region"]
      region_code_unique:
        type: "UNIQUE"
        properties: ["region", "code"]
relationships:
  knows:
    type: "KNOWS"
    from: {}
    to: {}
    properties:
      since: { type: "DATE" }
    constraints:
      since_key:
        type: "KEY"
        properties: ["since"]
      since_unique:
        type: "UNIQUE"
        properties: ["since"]
