schema: "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
version: "1"
id: "mapping-dependency-graphs"
description: "A three-mapping cycle with a mapping depending on it, a cycle between node and relationship mappings, and a list id that needs escaping in paths with a mapping missing its key after the first entry."
nodes:
  person:
    properties:
      id: { type: "STRING" }
relationships:
  knows:
    type: "KNOWS"
    from: { node: "person" }
    to: { node: "person" }
    properties:
      since: { type: "DATE" }
extensions:
  data_source_mappings:
    load:
      - type: "QUERY"
        table: "people"
        query: "RETURN 1"
        depends_on: "y"
        id: "x"
      - type: "QUERY"
        table: "people"
        query: "RETURN 1"
        depends_on: "z"
        id: "y"
      - type: "QUERY"
        table: "people"
        query: "RETURN 1"
        depends_on: "x"
        id: "z"
      - type: "QUERY"
        table: "people"
        query: "RETURN 1"
        depends_on: "x"
        id: "tail"
      - type: "NODE"
        node: "person"
        table: "people"
        properties:
          id: { column: "id" }
        key: ["id"]
        depends_on: "friendships"
        id: "people"
      - type: "RELATIONSHIP"
        relationship: "knows"
        table: "friendships"
        from_node:
          {}
        to_node:
          {}
        properties:
          since: { column: "since" }
        key: ["since"]
        depends_on: "people"
        id: "friendships"
    a/b~c:
      - type: "QUERY"
        table: "people"
        query: "RETURN 1"
        id: "first"
      - type: "NODE"
        node: "person"
        table: "people"
        properties:
          id: { column: "id" }
        id: "second"
      - type: "QUERY"
        table: "people"
        query: "RETURN 1"
        depends_on: "missing"
        id: "first"
